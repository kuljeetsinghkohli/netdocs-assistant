[project]
name = "netdocs"
version = "0.1.0"
description = "RAG-based assistant for Contoso Global network documentation"
requires-python = ">=3.9"
dependencies = [
    # Core ML / embeddings
    "sentence-transformers>=2.2.0",
    # Vector store
    "chromadb>=0.4.0",
    # Config management
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.30.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netdocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
