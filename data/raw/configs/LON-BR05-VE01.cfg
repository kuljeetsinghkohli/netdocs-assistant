! ===========================================================
! Contoso Global Network — Device Configuration
! Device:    LON-BR05-VE01
! Role:      Branch vEdge Router (Spoke)
! Site:      LON-BR05 (London Branch — Canary Wharf East)
! Platform:  Cisco vEdge-1000, vEdge OS 20.12.1
! Last Updated: 2024-11-20
! Note:      BT MPLS decommission pending (CRQ-2025-0201)
!            Currently: MPLS primary + BT Broadband secondary
! ===========================================================

system
 host-name              LON-BR05-VE01
 system-ip              10.200.2.5
 site-id                1005
 organization-name      "Contoso Global"
 vbond                  10.200.0.30
 logging
  server 10.200.5.100
   vpn 512
  !
 !
 ntp
  server 10.200.5.200
   vpn 512
   prefer true
  !
 !
!
vpn 0
 interface ge0/0
  description BT-MPLS-Primary
  ip address 172.16.8.2/30
  no shutdown
  tunnel-interface
   encapsulation ipsec weight 1
   color mpls restrict
   allow-service all
   bfd interval 500 min_rx 500 multiplier 3
  !
 !
 interface ge0/1
  description BT-Broadband-Secondary
  ip dhcp-client
  no shutdown
  tunnel-interface
   encapsulation ipsec weight 5
   color biz-internet
   allow-service all
   bfd interval 500 min_rx 500 multiplier 3
  !
 !
 ip route 0.0.0.0/0 172.16.8.1
!
vpn 1
 name Corporate
 interface ge0/2
  description LAN-Access-Switch
  ip address 10.10.5.1/24
  no shutdown
 !
!
vpn 2
 name Guest
 interface ge0/3
  description Guest-WiFi
  ip address 172.20.5.1/24
  no shutdown
 !
 nat
  natpool 1 172.20.5.0 172.20.5.254 prefix-length 24 overload
 !
!
vpn 512
 interface eth0
  ip address 10.200.2.5/32
  no shutdown
 !
 ip route 0.0.0.0/0 10.200.5.1
!
