! ===========================================================
! Contoso Global Network — Device Configuration
! Device:    NYC-BR03-VE01
! Role:      Branch vEdge Router (Spoke)
! Site:      NYC-BR03 (New York Branch — Midtown)
! Platform:  Cisco vEdge-2000, vEdge OS 20.12.1
! Last Updated: 2024-11-20
! Transport: Lumen MPLS (primary) + Comcast Business (secondary) + Verizon 4G LTE (tertiary)
! ===========================================================

system
 host-name              NYC-BR03-VE01
 system-ip              10.200.2.103
 site-id                2003
 organization-name      "Contoso Global"
 vbond                  10.200.0.30
 logging
  server 10.200.5.100
   vpn 512
  !
 !
 ntp
  server 10.200.5.200
   vpn 512
   prefer true
  !
 !
!
vpn 0
 interface ge0/0
  description Lumen-MPLS-Primary
  ip address 172.17.5.2/30
  no shutdown
  tunnel-interface
   encapsulation ipsec weight 1
   color mpls restrict
   allow-service all
   bfd interval 500 min_rx 500 multiplier 3
  !
 !
 interface ge0/1
  description Comcast-Broadband-Secondary
  ip dhcp-client
  no shutdown
  tunnel-interface
   encapsulation ipsec weight 5
   color biz-internet
   allow-service all
   bfd interval 500 min_rx 500 multiplier 3
  !
 !
 interface ge0/2
  description Verizon-LTE-Tertiary
  ip dhcp-client
  no shutdown
  tunnel-interface
   encapsulation ipsec weight 10
   color lte
   allow-service all
   bfd interval 1000 min_rx 1000 multiplier 3
  !
 !
 ip route 0.0.0.0/0 172.17.5.1
!
vpn 1
 name Corporate
 interface ge0/3
  description LAN-Access-Uplink
  ip address 10.10.103.1/24
  no shutdown
 !
!
vpn 2
 name Guest
 interface ge0/4
  description Guest-WiFi
  ip address 172.20.103.1/24
  no shutdown
 !
 nat
  natpool 1 172.20.103.0 172.20.103.254 prefix-length 24 overload
 !
!
vpn 10
 name Voice
 interface ge0/5
  description IP-Phone-VLAN
  ip address 10.50.103.1/24
  no shutdown
 !
 ! DSCP EF marking applied via vManage policy
!
vpn 512
 interface eth0
  ip address 10.200.2.103/32
  no shutdown
 !
 ip route 0.0.0.0/0 10.200.5.1
!
