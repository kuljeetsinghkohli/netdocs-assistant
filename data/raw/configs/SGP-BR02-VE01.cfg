! ===========================================================
! Contoso Global Network — Device Configuration
! Device:    SGP-BR02-VE01
! Role:      Branch vEdge Router (Spoke) — APAC
! Site:      SGP-BR02 (Singapore Branch — Raffles Place)
! Platform:  Cisco vEdge-1000, vEdge OS 20.12.1
! Last Updated: 2024-12-12 (CRQ-2024-1212 BFD tuning)
! Transport: SingTel MPLS (primary) + StarHub Broadband (secondary)
! ===========================================================

system
 host-name              SGP-BR02-VE01
 system-ip              10.200.2.202
 site-id                2002
 organization-name      "Contoso Global"
 vbond                  10.200.0.30
 logging
  server 10.200.5.100
   vpn 512
  !
 !
 ntp
  server 10.200.5.200
   vpn 512
   prefer true
  !
 !
!
vpn 0
 interface ge0/0
  description SingTel-MPLS-Primary
  ip address 172.18.5.2/30
  no shutdown
  tunnel-interface
   encapsulation ipsec weight 1
   color mpls restrict
   allow-service all
   ! BFD tuned per CRQ-2024-1212: 200ms -> 500ms to reduce false positives on SingTel
   bfd interval 500 min_rx 500 multiplier 3
  !
 !
 interface ge0/1
  description StarHub-Broadband-Secondary
  ip dhcp-client
  no shutdown
  tunnel-interface
   encapsulation ipsec weight 5
   color biz-internet
   allow-service all
   bfd interval 500 min_rx 500 multiplier 3
  !
 !
 ip route 0.0.0.0/0 172.18.5.1
!
vpn 1
 name Corporate
 interface ge0/2
  description LAN-Access-Switch
  ip address 10.12.2.1/24
  no shutdown
 !
!
vpn 2
 name Guest
 interface ge0/3
  description Guest-WiFi
  ip address 172.20.202.1/24
  no shutdown
 !
 nat
  natpool 1 172.20.202.0 172.20.202.254 prefix-length 24 overload
 !
!
vpn 10
 name Voice
 interface ge0/4
  description IP-Phone-VLAN
  ip address 10.50.202.1/24
  no shutdown
 !
!
vpn 512
 interface eth0
  ip address 10.200.2.202/32
  no shutdown
 !
 ip route 0.0.0.0/0 10.200.5.1
!
