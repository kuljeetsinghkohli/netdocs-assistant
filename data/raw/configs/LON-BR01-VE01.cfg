! ===========================================================
! Contoso Global Network — Device Configuration
! Device:    LON-BR01-VE01
! Role:      Branch vEdge Router (Spoke)
! Site:      LON-BR01 (London Branch — Paddington)
! Platform:  Cisco vEdge-1000, vEdge OS 20.12.1
! Last Updated: 2024-11-20
! ===========================================================

system
 host-name              LON-BR01-VE01
 system-ip              10.200.2.1
 site-id                1001
 organization-name      "Contoso Global"
 vbond                  10.200.0.30
 aaa
  auth-order             local radius
  usergroup netadmin
   task system read write
   task interface read write
  !
 !
 logging
  disk
   enable
  !
  server 10.200.5.100
   vpn 512
   priority informational
  !
 !
 ntp
  server 10.200.5.200
   vpn 512
   version 4
   prefer true
  !
 !
!
!
! ============================================================
! VPN 0 — Transport (Underlay)
! ============================================================
vpn 0
 !
 interface ge0/0
  description BT-MPLS-Transport
  ip address 172.16.5.2/30
  ipv6 dhcp-client
  no shutdown
  arp-timeout 1200
  tunnel-interface
   encapsulation ipsec weight 1
   color mpls restrict
   allow-service all
   no allow-service bgp
   allow-service dhcp
   allow-service dns
   allow-service icmp
   allow-service sshd
   allow-service ntp
   allow-service ospf
   bfd interval 500 min_rx 500 multiplier 3
  !
 !
 interface ge0/1
  description Virgin-Media-Broadband
  ip dhcp-client
  no shutdown
  tunnel-interface
   encapsulation ipsec weight 5
   color biz-internet
   allow-service all
   bfd interval 500 min_rx 500 multiplier 3
  !
 !
 !
 ip route 0.0.0.0/0 172.16.5.1
!
!
! ============================================================
! VPN 1 — Corporate
! ============================================================
vpn 1
 name Corporate
 !
 interface ge0/2
  description LAN-Access-Switch-Uplink
  ip address 10.10.1.1/24
  no shutdown
  arp-timeout 1200
 !
 !
 ospf
  router-id 10.200.2.1
 !
 !
 ip route 0.0.0.0/0 vpn 0 ge0/1
!
!
! ============================================================
! VPN 2 — Guest
! ============================================================
vpn 2
 name Guest
 !
 interface ge0/3
  description Guest-WiFi-AP-Uplink
  ip address 172.20.1.1/24
  no shutdown
 !
 nat
  natpool 1 172.20.1.0 172.20.1.254 prefix-length 24 overload
  route-import-from vpn 0
 !
 ip route 0.0.0.0/0 ge0/1
!
!
! ============================================================
! VPN 512 — Management
! ============================================================
vpn 512
 name Management
 !
 interface eth0
  description OOB-Management
  ip address 10.200.2.1/32
  no shutdown
 !
 ip route 0.0.0.0/0 10.200.5.1
!
!
! ============================================================
! Policies (Applied via vManage — shown for reference)
! ============================================================
! policy
!  data-policy ZIA-Internet-Breakout
!   vpn-list Corporate
!   sequence 10
!    match destination-ip 10.0.0.0/8
!    action accept
!   !
!   sequence 9999
!    match destination-ip 0.0.0.0/0
!    action accept nat outside zscaler-primary
!   !
!  !
! !
!
