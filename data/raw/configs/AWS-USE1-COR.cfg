! ===========================================================
! Contoso Global Network — Device Configuration
! Device:    AWS-USE1-COR
! Role:      Cloud On-Ramp (CSR 1000V) — AWS us-east-1
! Platform:  Cisco CSR 1000V IOS-XE 17.9.4
! Instance:  c5.xlarge, AWS Account 123456789012
! VPC:       prod-vpc-use1 (10.100.0.0/16)
! Last Updated: 2024-10-02 (CRQ-2024-1002 failover test)
! ===========================================================

hostname AWS-USE1-COR
!
enable secret 5 <redacted>
!
aaa new-model
aaa authentication login default local
!
username netops privilege 15 secret 5 <redacted>
!
! --- AWS ENI Interfaces ---
interface GigabitEthernet1
 description AWS-VPC-LAN — prod-vpc-use1
 ip address 10.100.0.5 255.255.0.0
 no shutdown
!
interface GigabitEthernet2
 description SD-WAN-Transport — AWS Public IP (EIP)
 ip address 10.100.1.5 255.255.255.0
 no shutdown
!
interface Loopback0
 description SD-WAN System IP
 ip address 10.200.1.5 255.255.255.255
!
! --- SD-WAN vEdge Cloud Configuration ---
! Note: AWS-USE1-COR is a Catalyst SD-WAN (CSR 1000V) acting
! as cloud on-ramp. OMP sessions via GigabitEthernet2 (public EIP).
!
sdwan
 interface GigabitEthernet2
  tunnel-interface
   encapsulation ipsec
   color biz-internet
   allow-service all
   bfd interval 500 min_rx 500 multiplier 3
  !
 !
 omp
  send-path-limit 4
  ecmp-limit       4
  graceful-restart
  !
  address-family ipv4
   advertise bgp
   advertise connected
   advertise static
  !
 !
!
! --- BGP for AWS TGW ---
router bgp 65001
 bgp router-id 10.200.1.5
 bgp log-neighbor-changes
 !
 neighbor 10.100.254.1 remote-as 64512
 neighbor 10.100.254.1 description AWS-TGW-BGP
 neighbor 10.100.254.1 timers 30 90
 neighbor 10.100.254.1 route-map RM-FROM-TGW-IN in
 neighbor 10.100.254.1 route-map RM-TO-TGW-OUT out
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute sdwan
 exit-address-family
!
ip prefix-list PL-AWS-VPC seq 10 permit 10.100.0.0/15 le 24
ip prefix-list PL-CONTOSO-ONPREM seq 10 permit 10.0.0.0/8
!
route-map RM-FROM-TGW-IN permit 10
 match ip address prefix-list PL-AWS-VPC
 set local-preference 100
!
route-map RM-FROM-TGW-IN deny 9999
!
route-map RM-TO-TGW-OUT permit 10
 match ip address prefix-list PL-CONTOSO-ONPREM
!
! --- Logging ---
logging host 10.200.5.100 transport tcp port 6514
ntp server 169.254.169.123   ! AWS time sync
!
end
