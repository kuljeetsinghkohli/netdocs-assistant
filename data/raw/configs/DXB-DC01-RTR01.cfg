! ===========================================================
! Contoso Global Network — Device Configuration
! Device:    DXB-DC01-RTR01
! Role:      Hub Router / OSPF Area 3 (NSSA) / Middle East DC
! Site:      DXB-DC01 (Dubai Data Centre)
! Platform:  Cisco IOS-XE 17.9.4
! Last Updated: 2024-11-10 (CRQ-2024-1110 NSSA conversion)
! ===========================================================

hostname DXB-DC01-RTR01
!
enable secret 5 <redacted>
!
aaa new-model
aaa authentication login default local
!
username netops privilege 15 secret 5 <redacted>
!
interface Loopback0
 ip address 10.200.1.4 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0/0
 description ETISALAT-MPLS-PE — Circuit ET-WAN-DXB-001
 ip address 172.19.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/1
 description DC-SERVER-LAN
 ip address 10.13.0.1 255.255.0.0
 ip ospf 1 area 3
 ip ospf message-digest-key 1 md5 <redacted>
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 no shutdown
!
interface GigabitEthernet0/0/2
 description OT-IOT-NETWORK
 ip address 10.13.200.1 255.255.255.0
 ip ospf 1 area 3
 ip ospf message-digest-key 1 md5 <redacted>
 no shutdown
!
interface GigabitEthernet0/0/3
 description DC-INTERCONNECT-TO-LON
 ip address 10.200.40.2 255.255.255.252
 ip ospf 1 area 0
 ip ospf message-digest-key 1 md5 <redacted>
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf network point-to-point
 no shutdown
!
router ospf 1
 router-id 10.200.1.4
 area 0 authentication message-digest
 area 3 nssa
 area 3 authentication message-digest
 timers throttle spf 50 200 5000
 passive-interface default
 no passive-interface GigabitEthernet0/0/1
 no passive-interface GigabitEthernet0/0/2
 no passive-interface GigabitEthernet0/0/3
 redistribute static subnets route-map RM-STATIC-TO-OSPF
 redistribute bgp 65001 subnets route-map RM-BGP-TO-OSPF
!
router bgp 65001
 bgp router-id 10.200.1.4
 bgp log-neighbor-changes
 bgp dampening 15 750 2000 60
 !
 neighbor IBGP-HUBS peer-group
 neighbor IBGP-HUBS remote-as 65001
 neighbor IBGP-HUBS update-source Loopback0
 neighbor IBGP-HUBS next-hop-self
 neighbor IBGP-HUBS fall-over bfd
 !
 neighbor 10.200.1.1 peer-group IBGP-HUBS
 neighbor 10.200.1.1 description LON-DC01-RTR01
 neighbor 10.200.1.2 peer-group IBGP-HUBS
 neighbor 10.200.1.2 description NYC-DC01-RTR01
 neighbor 10.200.1.3 peer-group IBGP-HUBS
 neighbor 10.200.1.3 description SGP-DC01-RTR01
 !
 neighbor 172.19.0.1 remote-as 99999
 neighbor 172.19.0.1 description ETISALAT-MPLS-PE
 neighbor 172.19.0.1 timers 30 90
 neighbor 172.19.0.1 fall-over bfd
 neighbor 172.19.0.1 route-map RM-FROM-ETISALAT-IN in
 neighbor 172.19.0.1 route-map RM-TO-ETISALAT-OUT out
 !
 address-family ipv4 unicast
  network 10.0.0.0 mask 255.0.0.0
  redistribute ospf 1 route-map RM-OSPF-TO-BGP
 exit-address-family
!
ip prefix-list PL-CONTOSO-SUMMARY seq 10 permit 10.0.0.0/8
ip prefix-list PL-DXB-DC-PREFIXES seq 10 permit 10.13.0.0/16
ip prefix-list PL-IOT-STATIC seq 10 permit 10.13.200.0/24
!
route-map RM-FROM-ETISALAT-IN permit 10
 match ip address prefix-list PL-CONTOSO-SUMMARY
 set local-preference 200
 set community 65001:100
!
route-map RM-FROM-ETISALAT-IN deny 9999
!
route-map RM-TO-ETISALAT-OUT permit 10
 match ip address prefix-list PL-CONTOSO-SUMMARY
!
route-map RM-OSPF-TO-BGP permit 10
 match ip address prefix-list PL-DXB-DC-PREFIXES
 set community 65001:200
!
route-map RM-STATIC-TO-OSPF permit 10
 match ip address prefix-list PL-IOT-STATIC
!
route-map RM-BGP-TO-OSPF permit 10
 match community CM-CLOUD-ROUTES
!
ip community-list standard CM-CLOUD-ROUTES permit 65001:400
!
ip route 10.13.200.0 255.255.255.0 GigabitEthernet0/0/2
!
logging host 10.200.5.100 transport tcp port 6514
ntp server 10.200.5.200 prefer
!
end
