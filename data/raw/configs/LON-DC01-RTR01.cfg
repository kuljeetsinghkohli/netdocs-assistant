! ===========================================================
! Contoso Global Network — Device Configuration
! Device:    LON-DC01-RTR01
! Role:      Hub Router / ASBR / iBGP Peer
! Site:      LON-DC01 (London Data Centre)
! Platform:  Cisco IOS-XE 17.9.4
! Last Updated: 2024-10-15 (CRQ-2024-1015)
! ===========================================================

hostname LON-DC01-RTR01
!
boot-start-marker
boot-end-marker
!
enable secret 5 <redacted>
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username netops privilege 15 secret 5 <redacted>
!
! --- Management ---
interface Loopback0
 description Loopback — Router-ID
 ip address 10.200.1.1 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0/0
 description LINK-TO-LON-DC01-RTR02
 ip address 10.200.10.1 255.255.255.252
 ip ospf 1 area 0
 ip ospf message-digest-key 1 md5 <redacted>
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf network point-to-point
 no shutdown
!
interface GigabitEthernet0/0/1
 description BT-MPLS-PE — Circuit BT-WAN-LON-001
 ip address 172.16.0.2 255.255.255.252
 no ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/0/2
 description LUMEN-BACKUP-MPLS — Circuit LU-WAN-LON-001
 ip address 172.16.1.2 255.255.255.252
 no shutdown
!
interface Vlan200
 description AZURE-EXPRESSROUTE-LD4
 ip address 172.16.10.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/3
 description DIRECT-CONNECT-VIF — AWS DX
 ip address 169.254.100.2 255.255.255.252
 no shutdown
!
! --- OSPF ---
router ospf 1
 router-id 10.200.1.1
 area 0 authentication message-digest
 area 1 range 10.11.0.0 255.255.0.0
 area 2 range 10.12.0.0 255.255.0.0
 area 3 nssa
 timers throttle spf 50 200 5000
 timers throttle lsa 50 200 5000
 passive-interface default
 no passive-interface GigabitEthernet0/0/0
 summary-address 10.10.0.0 255.255.240.0
 redistribute bgp 65001 subnets route-map RM-BGP-TO-OSPF
!
! --- BGP ---
router bgp 65001
 bgp router-id 10.200.1.1
 bgp log-neighbor-changes
 bgp dampening 15 750 2000 60
 bgp additional-paths send receive
 !
 neighbor IBGP-HUBS peer-group
 neighbor IBGP-HUBS remote-as 65001
 neighbor IBGP-HUBS update-source Loopback0
 neighbor IBGP-HUBS next-hop-self
 neighbor IBGP-HUBS fall-over bfd
 !
 neighbor 10.200.1.2 peer-group IBGP-HUBS
 neighbor 10.200.1.2 description NYC-DC01-RTR01
 neighbor 10.200.1.3 peer-group IBGP-HUBS
 neighbor 10.200.1.3 description SGP-DC01-RTR01
 neighbor 10.200.1.4 peer-group IBGP-HUBS
 neighbor 10.200.1.4 description DXB-DC01-RTR01
 !
 neighbor 172.16.0.1 remote-as 12345
 neighbor 172.16.0.1 description BT-MPLS-PE
 neighbor 172.16.0.1 timers 30 90
 neighbor 172.16.0.1 fall-over bfd
 neighbor 172.16.0.1 route-map RM-FROM-BT-IN in
 neighbor 172.16.0.1 route-map RM-TO-BT-OUT out
 !
 neighbor 172.16.1.1 remote-as 45678
 neighbor 172.16.1.1 description LUMEN-BACKUP
 neighbor 172.16.1.1 timers 30 90
 neighbor 172.16.1.1 fall-over bfd
 neighbor 172.16.1.1 route-map RM-FROM-LUMEN-IN in
 neighbor 172.16.1.1 route-map RM-TO-BT-OUT out
 !
 neighbor 172.16.10.1 remote-as 12076
 neighbor 172.16.10.1 description AZURE-EXPRESSROUTE
 neighbor 172.16.10.1 timers 30 90
 neighbor 172.16.10.1 route-map RM-FROM-AZURE-ER-IN in
 neighbor 172.16.10.1 route-map RM-TO-AZURE-ER-OUT out
 !
 neighbor 169.254.100.1 remote-as 64512
 neighbor 169.254.100.1 description AWS-DIRECT-CONNECT
 neighbor 169.254.100.1 route-map RM-FROM-AWS-DX-IN in
 neighbor 169.254.100.1 route-map RM-TO-AWS-DX-OUT out
 !
 address-family ipv4 unicast
  network 10.0.0.0 mask 255.0.0.0
  bgp additional-paths select backup
  neighbor IBGP-HUBS additional-paths send receive
  redistribute ospf 1 route-map RM-OSPF-TO-BGP
 exit-address-family
!
! --- Prefix Lists ---
ip prefix-list PL-CONTOSO-SUMMARY seq 10 permit 10.0.0.0/8
ip prefix-list PL-CONTOSO-SUMMARY seq 9999 deny 0.0.0.0/0 le 32
!
ip prefix-list PL-BT-ACCEPTABLE seq 10 permit 10.0.0.0/8 le 24
ip prefix-list PL-BT-ACCEPTABLE seq 20 permit 172.16.0.0/12 le 30
ip prefix-list PL-BT-ACCEPTABLE seq 9999 deny 0.0.0.0/0
!
ip prefix-list PL-AWS-VPCS seq 10 permit 10.100.0.0/15 le 24
ip prefix-list PL-AWS-VPCS seq 20 permit 10.101.0.0/16 le 24
!
ip prefix-list PL-AZURE-VNETS seq 10 permit 10.102.0.0/16 le 24
ip prefix-list PL-AZURE-VNETS seq 20 permit 10.103.0.0/16 le 24
!
ip prefix-list PL-DC-PREFIXES seq 10 permit 10.10.0.0/20
ip prefix-list PL-DC-PREFIXES seq 9999 deny 0.0.0.0/0 le 32
!
ip prefix-list PL-CONTOSO-TO-AWS seq 10 permit 10.10.0.0/16
ip prefix-list PL-CONTOSO-TO-AWS seq 20 permit 10.11.0.0/16
!
! --- Route Maps ---
route-map RM-FROM-BT-IN permit 10
 match ip address prefix-list PL-BT-ACCEPTABLE
 set local-preference 200
 set community 65001:100
!
route-map RM-FROM-BT-IN deny 9999
!
route-map RM-FROM-LUMEN-IN permit 10
 match ip address prefix-list PL-BT-ACCEPTABLE
 set local-preference 150
 set community 65001:150
!
route-map RM-FROM-LUMEN-IN deny 9999
!
route-map RM-TO-BT-OUT permit 10
 match ip address prefix-list PL-CONTOSO-SUMMARY
 set as-path prepend 65001 65001
!
route-map RM-FROM-AZURE-ER-IN permit 10
 match ip address prefix-list PL-AZURE-VNETS
 set local-preference 180
 set community 65001:400
!
route-map RM-FROM-AZURE-ER-IN deny 9999
!
route-map RM-TO-AZURE-ER-OUT permit 10
 match ip address prefix-list PL-CONTOSO-SUMMARY
!
route-map RM-FROM-AWS-DX-IN permit 10
 match ip address prefix-list PL-AWS-VPCS
 set local-preference 180
 set community 65001:400
!
route-map RM-FROM-AWS-DX-IN deny 9999
!
route-map RM-TO-AWS-DX-OUT permit 10
 match ip address prefix-list PL-CONTOSO-TO-AWS
 set community 65001:200
!
route-map RM-OSPF-TO-BGP permit 10
 match ip address prefix-list PL-DC-PREFIXES
 set community 65001:200
!
route-map RM-BGP-TO-OSPF permit 10
 match community CM-CLOUD-ROUTES
 set metric-type type-2
 set metric 20
!
! --- Community Lists ---
ip community-list standard CM-CLOUD-ROUTES permit 65001:400
!
! --- BFD ---
bfd slow-timers 2000
!
! --- IP SLA for monitoring ---
ip sla 1
 icmp-echo 10.200.1.2 source-interface Loopback0
 frequency 10
ip sla schedule 1 life forever start-time now
!
! --- Logging ---
logging host 10.200.5.100 transport tcp port 6514
logging trap informational
logging source-interface Loopback0
!
! --- NTP ---
ntp server 10.200.5.200 prefer
ntp server 10.200.5.201
!
! --- SNMP ---
snmp-server community <redacted> RO
snmp-server host 10.200.5.150 traps <redacted>
snmp-server ifindex persist
!
end
